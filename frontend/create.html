<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open a slot · Plinth</title><meta name="description" content="Plinth: a sealed-bid auction for one public slot on GenLayer. The AI gate reads the words, never the money."><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="create"><main class="wrap sec"><h1 style="font-size:clamp(2rem,4vw,3rem)">Open a slot</h1><p class="mut" style="max-width:62ch">You become the curator. Write 1 to 5 plain rules; the AI gate checks every bid message against them. Terms cannot be changed afterwards, except pausing and the beneficiary.</p>
<form class="card" id="createForm" style="max-width:780px"><label>Name <span class="mut">(3–60 characters)</span></label><input name="name" required minlength="3" maxlength="60">
<label>Rules <span class="mut">(one per line, 1 to 5 lines, 8–140 characters each)</span></label><textarea name="rules" required></textarea>
<div class="row"><div><label>Deposit = highest allowed price (GEN)</label><input name="max" required inputmode="decimal" placeholder="1"></div><div><label>Reserve price (GEN)</label><input name="reserve" required inputmode="decimal" placeholder="0.1"></div></div>
<div class="row3"><div><label>Display time</label><input name="hold" type="number" min="1" required><select class="unit" name="holdu"></select></div><div><label>Bid phase</label><input name="bid" type="number" min="1" required><select class="unit" name="bidu"></select></div><div><label>Review phase</label><input name="review" type="number" min="1" required><select class="unit" name="reviewu"></select></div></div>
<div class="row"><div><label>Reveal phase</label><input name="reveal" type="number" min="1" required><select class="unit" name="revealu"></select></div><div><label>Forfeit when not revealed (5–50 %)</label><input name="forfeit" type="number" min="5" max="50" required value="10"></div></div>
<label>Beneficiary <span class="mut">(optional address; empty = you)</span></label><input name="benef" placeholder="0x…">
<div class="cta"><button class="btn grad">Create slot</button><button type="button" class="btn" id="demo">Fill a quick test slot</button></div></form></main><script type="module" src="js/pages.js"></script></body></html>
